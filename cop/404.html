<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#1f3f30">
  <title>الصفحة غير موجودة | أمل الغد</title>
  <style>
    * { box-sizing: border-box; }
    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      padding: 1.5rem;
      color: #1b2a3a;
      background: #f7f3ea;
      font: 500 1rem/1.8 "Cairo", sans-serif;
    }
    main {
      width: min(100%, 38rem);
      padding: 2.5rem;
      border-top: 4px solid #c9a24b;
      background: #fff;
      text-align: center;
      box-shadow: 0 16px 48px rgba(27, 42, 58, .1);
    }
    h1 { margin: 0 0 .75rem; color: #1f3f30; }
    p { margin: 0 0 1.5rem; }
    a {
      display: inline-block;
      padding: .65rem 1.2rem;
      color: #fff;
      background: #1f3f30;
      text-decoration: none;
    }
  </style>
</head>
<body>
  <main>
    <h1>الصفحة غير موجودة</h1>
    <p>يبدو أن الرابط غير صحيح أو أن الصفحة نُقلت.</p>
    <a href="./">العودة إلى أمل الغد</a>
  </main>
</body>
</html>
